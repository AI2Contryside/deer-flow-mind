# =============================================================================
# Sandbox base Python dependencies
# =============================================================================
# Baked into the AIO sandbox overlay image so that agents can read/write
# Excel / Word / PDF / PPT / CSV / images / HTML without paying the cost of
# `pip install` on every cold start (the on-demand pattern in
# skills/public/data-analysis/scripts/analyze.py is what we are replacing).
#
# Pinning policy:
#   - lower bounds on the major.minor we depend on (matches backend pyproject
#     when both run the same package, e.g. duckdb, python-docx)
#   - upper-exclusive on the next major to keep agent-written code stable
#   - DO NOT pin patch — let the proxy serve the latest patch on rebuild
#   - DO NOT include docling / playwright / heavy ML — those belong to the
#     backend gateway image, not the sandbox.
#
# Version-resolution caveats:
#   - python-calamine wheels exist for Linux x86_64 / arm64 on Python 3.12
#   - pymupdf >=1.24 is required for Python 3.12 (older wheels miss 3.12)
#   - polars CPU-feature wheels: prefer `polars-lts-cpu` if devbox CPU is old
#     (uncomment the alt line below if `polars` segfaults on `illegal instruction`)

# ── Excel ────────────────────────────────────────────────────────────────────
openpyxl>=3.1,<4
xlsxwriter>=3.2,<4
python-calamine>=0.3.0,<1     # fast read-only xlsx (CLAUDE.md notes this for large files)
xlrd>=2.0,<3                  # legacy .xls only

# ── Word ─────────────────────────────────────────────────────────────────────
python-docx>=1.1.0,<2         # backend pyproject already pins >=1.1.0
