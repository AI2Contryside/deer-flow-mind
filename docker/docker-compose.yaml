# DeerFlow Production Environment
# Usage: make up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - gateway:     FastAPI Gateway API
#   - langgraph:   LangGraph production server (Dockerfile generated by langgraph dockerfile)
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   DEER_FLOW_HOME                   — runtime data dir, default $REPO_ROOT/backend/.deer-flow
#   DEER_FLOW_CONFIG_PATH            — path to config.yaml
#   DEER_FLOW_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   DEER_FLOW_DOCKER_SOCKET          — Docker socket path, default /var/run/docker.sock
#   DEER_FLOW_REPO_ROOT              — repo root (used for skills host path in DooD)
#
# LangSmith tracing is disabled by default (LANGCHAIN_TRACING_V2=false).
# Set LANGCHAIN_TRACING_V2=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:${PORT:-2026}
#
# Logging: every service uses the same json-file rotation policy below.
# Without this, dockerd's default json-file driver runs unbounded and
# /var/lib/docker/containers/*/*-json.log grows until disk fills. Pinned
# after the 2026-05-02 PG-leak post-mortem when
# `docker logs deer-flow-langgraph --since 2026-05-02T22:00` came back
# empty: the older container had been replaced and its (much larger,
# unrotated) json.log was reaped with the old container ID. With
# rotation we lose deep history *predictably* (per-container 50MB cap)
# but never lose the recent trailing window.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      # Bind-mount nginx access/error logs to the repo's logs/ dir so the
      # request-level history survives container down/up cycles. nginx.conf
      # writes to /var/log/nginx/*.log AND /dev/stdout — keeping stdout
      # means `docker logs` / `make docker-logs` continues to work for
      # interactive debugging, while the file copy is what
      # auditing/grep/awk needs. Host dir is created during deploy.
      - ${DEER_FLOW_LOG_DIR:-../logs}/nginx:/var/log/nginx
    depends_on:
      - gateway
      - langgraph
    networks:
      - deer-flow
    restart: unless-stopped
    logging: *default-logging

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: deer-flow-gateway
    command: sh -c "cd backend && uv run uvicorn src.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    # Defaults (`${VAR:-...}`) mirror what scripts/deploy.sh would export, so
    # `docker compose restart` works even when invoked outside that wrapper
    # (e.g. by scripts/deploy/deploy-deerflow.sh in restart-only mode).
    # Relative paths resolve from this compose file's dir (`docker/`).
    volumes:
      - ${DEER_FLOW_CONFIG_PATH:-../config.yaml}:/app/backend/config.yaml:ro
      - ${DEER_FLOW_EXTENSIONS_CONFIG_PATH:-../extensions_config.json}:/app/backend/extensions_config.json:ro
      # gateway needs write access for POST /api/skills/install to extract
      # uploaded .skill archives into /app/skills/custom/. langgraph keeps
      # its skills mount read-only (below) since it only reads skills.
      - ../skills:/app/skills
      - ${DEER_FLOW_HOME:-../backend/.deer-flow}:/app/backend/.deer-flow
      # DooD: AioSandboxProvider starts sandbox containers via host Docker daemon
      - ${DEER_FLOW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      # DooD path/network translation. These must be absolute host paths so
      # the host Docker daemon can resolve them when spawning sandbox
      # containers; the relative-path fallbacks here only keep the parse
      # green — DooD itself still requires deploy.sh to export real values.
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_HOME:-../backend/.deer-flow}
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_REPO_ROOT:-..}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      # Inside the docker-compose network LangGraph is reachable via its
      # service alias `langgraph:2024`. Required by the gateway's
      # template_extraction kickoff (POST /api/template/extract_fields).
      - DEER_FLOW_LANGGRAPH_URL=http://langgraph:2024
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped
    logging: *default-logging

  # ── LangGraph Server ───────────────────────────────────────────────────────
  # TODO: switch to langchain/langgraph-api (licensed) once a license key is available.
  # For now, use `langgraph dev` (no license required) with the standard backend image.
  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: deer-flow-langgraph
    command: sh -c "cd /app/backend && uv run langgraph dev --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024"
    volumes:
      - ${DEER_FLOW_CONFIG_PATH:-../config.yaml}:/app/config.yaml:ro
      - ${DEER_FLOW_EXTENSIONS_CONFIG_PATH:-../extensions_config.json}:/app/extensions_config.json:ro
      - ${DEER_FLOW_HOME:-../backend/.deer-flow}:/app/backend/.deer-flow
      - ../skills:/app/skills:ro
      - ../backend/.langgraph_api:/app/backend/.langgraph_api
      # DooD: same as gateway
      - ${DEER_FLOW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - CI=true
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_HOME:-../backend/.deer-flow}
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_REPO_ROOT:-..}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      # Disable LangSmith tracing — LANGSMITH_API_KEY is not required.
      # Set LANGCHAIN_TRACING_V2=true and LANGSMITH_API_KEY in .env to enable.
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      # langgraph_api defaults this to 25 (langgraph_api/utils/config.py:44),
      # which is too tight for multi-stage ERPNext flows (xlsx parse →
      # bootstrap probe → field discovery → stock receipt + retries).
      # Real failures (thread 0bc19732-...) needed ~30 supersteps; bumping
      # to 50 leaves headroom while still bounding runaway loops.
      - LANGGRAPH_DEFAULT_RECURSION_LIMIT=${LANGGRAPH_DEFAULT_RECURSION_LIMIT:-50}
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped
    logging: *default-logging

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    profiles:
      - provisioner
    build:
      context: ./provisioner
      dockerfile: Dockerfile
    container_name: deer-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${DEER_FLOW_REPO_ROOT:-..}/skills
      - THREADS_HOST_PATH=${DEER_FLOW_HOME:-../backend/.deer-flow}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging

networks:
  deer-flow:
    driver: bridge
