# DeerFlow Production Compose for Aliyun ECS.
#
# Differences from docker-compose.yaml (the dev/devbox compose):
#   - Image is pulled from Aliyun ACR — no local build on the ECS host.
#   - APP_ENV=prod selects /app/config.prod.yaml inside the image.
#     No bind-mount of config.yaml, so the file system contract is image-
#     immutable: a `compose pull && up -d` is the only thing that changes
#     application behaviour.
#   - DEER_FLOW_CONFIG_PATH is intentionally NOT set (the dev compose pins
#     it to /app/config.yaml, which would short-circuit APP_ENV).
#   - Secrets come from /etc/deerflow/secrets.env (chmod 600). Required
#     keys are documented in docs/CONFIG_ENVIRONMENTS.md.
#   - Sandbox runs under DooD against the host Docker socket, identical
#     to dev — Aliyun ECS instances are individual VMs so this is fine.
#     If you later switch to the K8s provisioner, enable the
#     provisioner profile.
#
# Required env vars in this compose file's directory (.env or shell):
#   DEERFLOW_IMAGE   full image ref, e.g.
#                    registry-vpc.cn-hangzhou.aliyuncs.com/<ns>/deerflow:prod
#   PORT             host port mapped to nginx (defaults to 2026)
#
# Required env vars in /etc/deerflow/secrets.env (consumed by the image
# at process start, fail-fast if missing):
#   DEEPSEEK_API_KEY                lead-agent text model
#   DASHSCOPE_API_KEY               qwen3.6-flash + qwen-vl-plus
#   ALIYUN_OSS_ACCESS_KEY_ID        OSS storage
#   ALIYUN_OSS_ACCESS_KEY_SECRET    OSS storage
#   (any kms:// resolver env, if config.prod.yaml uses kms:// refs)

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - langgraph
    networks:
      - deer-flow
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    image: ${DEERFLOW_IMAGE:?DEERFLOW_IMAGE must be set, e.g. registry-vpc.cn-hangzhou.aliyuncs.com/<ns>/deerflow:prod}
    container_name: deer-flow-gateway
    command: sh -c "cd backend && uv run uvicorn src.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    environment:
      - APP_ENV=prod
      - CI=true
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_HOME:-/var/lib/deerflow/data}
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_REPO_ROOT:-/var/lib/deerflow}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - DEER_FLOW_LANGGRAPH_URL=http://langgraph:2024
    env_file:
      - ${DEERFLOW_SECRETS_FILE:-/etc/deerflow/secrets.env}
    volumes:
      # Persistent runtime data: thread workspaces, memory.json, artifacts.
      # Mount a host path so a container restart doesn't lose state.
      - ${DEER_FLOW_HOME:-/var/lib/deerflow/data}:/app/backend/.deer-flow
      # Skills directory — read-write so /api/skills/install can extract
      # uploaded .skill archives. Mount a separate host path from the
      # image's baked /app/skills (which would be empty in a fresh
      # image anyway).
      - ${DEER_FLOW_SKILLS_DIR:-/var/lib/deerflow/skills}:/app/skills
      # DooD: sandbox containers via the host Docker daemon
      - ${DEER_FLOW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped

  # ── LangGraph Server ───────────────────────────────────────────────────────
  langgraph:
    image: ${DEERFLOW_IMAGE:?DEERFLOW_IMAGE must be set}
    container_name: deer-flow-langgraph
    command: sh -c "cd /app/backend && uv run langgraph dev --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024"
    environment:
      - APP_ENV=prod
      - CI=true
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_HOME:-/var/lib/deerflow/data}
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_REPO_ROOT:-/var/lib/deerflow}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGGRAPH_DEFAULT_RECURSION_LIMIT=${LANGGRAPH_DEFAULT_RECURSION_LIMIT:-50}
    env_file:
      - ${DEERFLOW_SECRETS_FILE:-/etc/deerflow/secrets.env}
    volumes:
      - ${DEER_FLOW_HOME:-/var/lib/deerflow/data}:/app/backend/.deer-flow
      - ${DEER_FLOW_SKILLS_DIR:-/var/lib/deerflow/skills}:/app/skills:ro
      - ${DEER_FLOW_LANGGRAPH_API_DIR:-/var/lib/deerflow/langgraph_api}:/app/backend/.langgraph_api
      - ${DEER_FLOW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow
    restart: unless-stopped

networks:
  deer-flow:
    driver: bridge
