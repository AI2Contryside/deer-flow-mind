[project]
name = "deer-flow"
version = "0.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-sandbox>=0.0.19",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "kubernetes>=30.0.0",
    "langchain>=1.2.3",
    "langchain-anthropic>=1.3.4",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.6",
    "langgraph-api>=0.7.0,<0.8.0",
    "langgraph-cli>=0.4.14",
    "langgraph-runtime-inmem>=0.22.1",
    "markdownify>=1.2.2",
    "docling>=2.0.0",
    "python-calamine>=0.2.3",
    "python-docx>=1.1.0",
    # Jinja-style template rendering for the fill_template tool. docxtpl
    # for .docx (full jinja, including tables / loops); xltpl for .xlsx
    # (preserves cell styles / formulas while substituting tags).
    "docxtpl>=0.20.1",
    "xltpl>=0.20",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "sse-starlette>=2.1.0",
    "tavily-python>=0.7.17",
    "firecrawl-py>=1.15.0",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.34.0",
    "ddgs>=9.10.0",
    "duckdb>=1.4.4",
    "langchain-google-genai>=4.2.1",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-checkpoint-postgres",
    "lark-oapi>=1.4.0",
    "markdown-to-mrkdwn>=0.3.1",
    "psycopg-pool",
    "psycopg[binary]",
    "oss2>=2.18.4",
    "alibabacloud-kms20160120>=2.4.0",
    "alibabacloud-tea-openapi>=0.4.4",
    "alibabacloud-credentials>=0.3.6",
    "python-telegram-bot>=21.0",
    "slack-sdk>=3.33.0",
    "langgraph-sdk>=0.1.51",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.14.11"]

# === SANDBOX FALLBACK DEPS START ==============================================
# Packages the agent reaches for via the `bash` tool when running in
# LocalSandbox mode (i.e. directly inside this venv). The same set is baked
# into the AIO sandbox image at deer-flow-mind/docker/sandbox/requirements.lock
# — keep the two lists in sync until LocalSandbox is retired.
#
# Migration tracker: docs/AIO_SANDBOX_MIGRATION_PLAN.md
#
# To install locally: `uv sync --group sandbox-fallback`
# To remove this group entirely once AIO is the only sandbox mode: delete
# everything between the START / END markers below — uv will drop the group
# on next sync. Packages already declared in [project].dependencies (docling,
# python-docx, python-calamine, duckdb, markdownify, pyyaml, httpx, pydantic)
# are intentionally NOT repeated here.
sandbox-fallback = [
    # Excel
    "openpyxl>=3.1,<4",
    "xlsxwriter>=3.2,<4",
    "xlrd>=2.0,<3",
    # Word (python-docx, python-calamine already in [project].dependencies)
    "docx2txt>=0.8,<1",
    "mammoth>=1.8,<2",
    # PDF read
    "pypdf>=4.0,<6",
    "pdfplumber>=0.11,<1",
    "pymupdf>=1.24,<2",
    # PDF write
    "reportlab>=4.0,<5",
    # PowerPoint
    "python-pptx>=1.0,<2",
    # Images
    "pillow>=10.0,<12",
    # HTML / Markdown (markdownify already in [project].dependencies)
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "markdown>=3.5,<4",
    "html2text>=2024.2.26,<2026",
    # Tabular / dataframe (duckdb already in [project].dependencies)
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16,<22",
    "polars>=1.0,<2",
    # Charts (Python side — chart-visualization skill itself is Node)
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    # Networking (httpx already in [project].dependencies)
    "requests>=2.31,<3",
    # Utilities
    "click>=8.1,<9",
    "tomli>=2.0,<3",
    "python-dateutil>=2.9,<3",
    "rich>=13.7,<15",
    "tqdm>=4.66,<5",
    "jsonschema>=4.21,<5",
    # Encoding helpers
    "chardet>=5.2,<6",
    "charset-normalizer>=3.3,<4",
]
# === SANDBOX FALLBACK DEPS END ================================================
